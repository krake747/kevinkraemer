packages:
  - .

allowBuilds:
  esbuild: true
  fallow: true
  lefthook: true
  netlify: true
  sharp: true
  unix-dgram: false

permissions:
  "@solidjs/web":
    skills: true
  "@ui-sdk/core":
    skills: true
  fallow:
    skills: true
  solid-js:
    skills: [reactivity-diagnostics, solid-2.0, solid-2.0-cheatsheet]

skills:
  dirs:
    - .agents/skills
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8001
  vitest: 5.1.1
  vite-plus: 1.8.0
  "@vitest/coverage-v8": 5.1.1
  "@vitest/browser-playwright": 5.1.1
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vitest
  allowedVersions:
    vitest: "*"
minimumReleaseAgeExclude:
  - "@sentry/bundler-plugins@11.17.0"
  - "@sentry/core@11.17.0"
  - "@sentry/server-utils@11.17.0"
  - "@voidzero-dev/vite-plus-core@8.3.8001"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.8.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.8.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.8.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.8.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.8.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.8.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.8.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.8.0"
  - vite-plus@1.8.0
