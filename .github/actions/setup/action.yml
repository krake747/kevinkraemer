name: Setup Vite+
description: Install the pinned Vite+ and Node.js from .node-version with dependency caching, then install frozen dependencies.

runs:
  using: composite
  steps:
    - name: Setup Vite+
      uses: voidzero-dev/setup-vp@v1.22.0
      with:
        node-version-file: ".node-version"
        cache: true
        run-install: false

    - name: Install dependencies
      shell: bash
      run: vp install --frozen-lockfile
