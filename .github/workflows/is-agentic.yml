name: Is Agentic

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  is-agentic:
    name: Is Agentic
    runs-on: ubuntu-latest
    steps:
      - name: Audit agent readiness
        run: npx -y is-agentic kevinkraemer.com --json | tee is-agentic.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: is-agentic-report
          path: is-agentic.json
          retention-days: 30
